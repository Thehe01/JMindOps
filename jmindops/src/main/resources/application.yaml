server:
  # 仅让 Tomcat 从受信任的内部代理解析转发头；直连请求继续使用 socket 地址。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

spring:
  application:
    name: jmindops
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/jmindops}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:0}
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:10MB}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    # 默认不自动注册本地 ChatModel；设置 SPRING_AI_MODEL_CHAT=ollama 后启用。
    # 云模型仍按各自 API Key 动态注册，none 不会屏蔽它们。
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:}
      base-url: ${ZHIPUAI_BASE_URL:https://open.bigmodel.cn/api/paas}
      chat:
        options:
          model: glm-4.6
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:}
        chat:
          options:
            model: gemini-2.5
    ollama:
      base-url: ${OLLAMA_CHAT_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5}
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        stdio:
          connections:
            filesystem-mcp:
              command: ${MCP_FILESYSTEM_COMMAND:npx}
              args:
                - "-y"
                - "@modelcontextprotocol/server-filesystem"
                - ${MCP_FILESYSTEM_ROOT:./data/mcp-workspace}

mybatis:
  type-aliases-package: com.kama.jmindops.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.kama.jmindops.typehandler

document:
  storage:
    base-path: ${DOCUMENT_STORAGE_BASE_PATH:./data/documents}

rag:
  retrieval:
    # 生成链路先扩大候选集，再由 reranker 压缩为最终上下文；低于阈值时返回“证据不足”。
    answer-top-k: ${RAG_ANSWER_TOP_K:5}
    candidate-top-k: ${RAG_CANDIDATE_TOP_K:20}
    evidence-gate-enabled: ${RAG_EVIDENCE_GATE_ENABLED:true}
    minimum-rerank-score: ${RAG_MINIMUM_RERANK_SCORE:0.05}
  embedding:
    base-url: ${RAG_EMBEDDING_BASE_URL:http://localhost:11434}
    model: ${RAG_EMBEDDING_MODEL:bge-m3}
    request-timeout-seconds: ${RAG_REQUEST_TIMEOUT_SECONDS:30}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1024}
    normalization: ${RAG_EMBEDDING_NORMALIZATION:none}
  index:
    pipeline-version: ${RAG_INDEX_PIPELINE_VERSION:tika-flexmark-chunk-v1}
  reranker:
    # none 为默认的未部署状态；http 对接 vLLM/Jina 协议，tei 对接 Hugging Face TEI。
    provider: ${RAG_RERANKER_PROVIDER:none}
    base-url: ${RAG_RERANKER_BASE_URL:http://localhost:8001}
    endpoint: ${RAG_RERANKER_ENDPOINT:/v1/rerank}
    tei-endpoint: ${RAG_RERANKER_TEI_ENDPOINT:/rerank}
    model: ${RAG_RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
    request-timeout-seconds: ${RAG_RERANKER_TIMEOUT_SECONDS:30}

app:
  agent:
    llm-stream-timeout-seconds: ${AGENT_LLM_STREAM_TIMEOUT_SECONDS:120}
  security:
    jwt-secret: ${APP_JWT_SECRET:}
    token-ttl-hours: ${APP_JWT_TTL_HOURS:1}
  tools:
    database:
      enabled: ${DATABASE_TOOL_ENABLED:false}
      jdbc-url: ${DATABASE_TOOL_JDBC_URL:}
      username: ${DATABASE_TOOL_USERNAME:jmindops_tool_reader}
      password: ${DATABASE_TOOL_PASSWORD:}
      allowed-relations: ${DATABASE_TOOL_ALLOWED_RELATIONS:agent,chat_session,chat_message,knowledge_base,document,chunk_bge_m3}
    email:
      enabled: ${EMAIL_TOOL_ENABLED:false}
    filesystem:
      enabled: ${FILESYSTEM_TOOL_ENABLED:false}
      base-path: ${FILESYSTEM_TOOL_BASE_PATH:./data/mcp-workspace}
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  generation:
    pending-redispatch-after-seconds: ${GENERATION_PENDING_REDISPATCH_AFTER_SECONDS:15}
    running-timeout-seconds: ${GENERATION_RUNNING_TIMEOUT_SECONDS:600}
    recovery-batch-size: ${GENERATION_RECOVERY_BATCH_SIZE:20}
    recovery-initial-delay-ms: ${GENERATION_RECOVERY_INITIAL_DELAY_MS:15000}
    recovery-fixed-delay-ms: ${GENERATION_RECOVERY_FIXED_DELAY_MS:15000}
  document-index:
    max-retries: ${DOCUMENT_INDEX_MAX_RETRIES:3}
    initial-backoff-seconds: ${DOCUMENT_INDEX_INITIAL_BACKOFF_SECONDS:2}
    backoff-multiplier: ${DOCUMENT_INDEX_BACKOFF_MULTIPLIER:2.0}
    max-backoff-seconds: ${DOCUMENT_INDEX_MAX_BACKOFF_SECONDS:60}
    running-timeout-seconds: ${DOCUMENT_INDEX_RUNNING_TIMEOUT_SECONDS:120}
    batch-size: ${DOCUMENT_INDEX_BATCH_SIZE:10}
    recovery-initial-delay-ms: ${DOCUMENT_INDEX_RECOVERY_INITIAL_DELAY_MS:10000}
    recovery-fixed-delay-ms: ${DOCUMENT_INDEX_RECOVERY_FIXED_DELAY_MS:10000}
    worker-threads: ${DOCUMENT_INDEX_WORKER_THREADS:2}
    worker-initial-delay-ms: ${DOCUMENT_INDEX_WORKER_INITIAL_DELAY_MS:5000}
    worker-poll-fixed-delay-ms: ${DOCUMENT_INDEX_WORKER_POLL_FIXED_DELAY_MS:5000}

