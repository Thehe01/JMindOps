name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend unit tests and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jmindops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify without live model calls
        run: mvn -B -ntp verify

  frontend:
    name: Frontend build and production dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  dependency-scan:
    name: Repository vulnerability and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  empty-database:
    name: Empty database migration smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_USER: jmindops_owner
      POSTGRES_DB: jmindops
      MCP_CLIENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "APP_DB_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "APP_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start from empty volumes
        run: docker compose up --detach --build --wait --wait-timeout 240
      - name: Verify health and Flyway history
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/health
          docker compose exec -T db psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --tuples-only --no-align \
            --command "SELECT COUNT(*) FROM flyway_schema_history WHERE success"
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Remove test stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jmindops
    services:
      postgres:
        image: paradedb/paradedb:0.25.6-pg15
        command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron"]
        env:
          POSTGRES_USER: jmindops_owner
          POSTGRES_PASSWORD: jmindops_owner
          POSTGRES_DB: jmindops
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Wait for database
        run: |
          for i in {1..10}; do
            docker exec ${{ job.services.postgres.id }} pg_isready -U jmindops_owner -d jmindops && break
            sleep 3
          done
      - name: Run PostgreSQL Integration Tests
        run: mvn -B -ntp verify -Dgroups="postgres-integration" -Dtest.excluded-groups=live -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/jmindops -Dspring.datasource.username=jmindops_owner -Dspring.datasource.password=jmindops_owner -Dspring.flyway.user=jmindops_owner -Dspring.flyway.password=jmindops_owner
