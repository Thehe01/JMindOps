version: 2
updates:
  - package-ecosystem: maven
    directory: /jchatmind
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /jchatmind
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /ui
    schedule:
      interval: weekly
