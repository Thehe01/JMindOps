<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMindOps 代码知识图谱查看器</title>
    <!-- 引入 Neo4j 浏览器驱动 -->
    <script src="https://cdn.jsdelivr.net/npm/neo4j-driver@5.12.0/lib/browser/neo4j-web.min.js"></script>
    <!-- 引入 vis-network 用于画图 -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #1e1e1e;
            color: #fff;
        }
        #header {
            padding: 15px 20px;
            background-color: #2d2d2d;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        h2 {
            margin: 0;
            font-size: 18px;
            color: #4ade80;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        #network {
            flex: 1;
            width: 100%;
        }
        .btn {
            background-color: #4ade80;
            color: #1e1e1e;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #22c55e;
        }
        #status {
            font-size: 12px;
            color: #aaa;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <div id="header">
        <h2>代码图谱</h2>
        <div class="controls">
            <!-- 节点类型过滤 -->
            <label class="checkbox-label" style="color: #ff9f43;">
                <input type="checkbox" id="chk-Type" checked onchange="updateFilter()"> 
                类/接口 (Type)
            </label>
            <label class="checkbox-label" style="color: #00cec9;">
                <input type="checkbox" id="chk-Method" checked onchange="updateFilter()"> 
                方法 (Method)
            </label>
            <label class="checkbox-label" style="color: #6c5ce7;">
                <input type="checkbox" id="chk-Field" checked onchange="updateFilter()"> 
                属性 (Field)
            </label>
            <label class="checkbox-label" style="color: #fd79a8;">
                <input type="checkbox" id="chk-Package" checked onchange="updateFilter()"> 
                包 (Package)
            </label>
            
            <button class="btn" onclick="loadGraph()">重新加载数据</button>
        </div>
        <div id="status">未连接</div>
    </div>

    <div id="network"></div>

    <script>
        let allNodes = new vis.DataSet();
        let allEdges = new vis.DataSet();
        let network = null;

        // 颜色映射字典
        const colorMap = {
            'Type': '#ff9f43',
            'Method': '#00cec9',
            'Field': '#6c5ce7',
            'Package': '#fd79a8',
            'Default': '#b2bec3'
        };

        // 获取节点对应的类型名称
        function getMainLabel(labels) {
            if (labels.includes('Type')) return 'Type';
            if (labels.includes('Method')) return 'Method';
            if (labels.includes('Field')) return 'Field';
            if (labels.includes('Package')) return 'Package';
            return labels[0] || 'Default';
        }

        async function loadGraph() {
            document.getElementById('status').innerText = "正在连接数据库...";
            document.getElementById('status').style.color = "#4ade80";

            allNodes.clear();
            allEdges.clear();

            // 连接到 Neo4j
            const driver = neo4j.driver('bolt://localhost:7687'); 
            const session = driver.session();

            try {
                // 默认查询: 获取项目内节点 (限定 com.kama 防止节点过多卡死浏览器)
                document.getElementById('status').innerText = "正在查询数据...";
                const query = `
                    MATCH (n)-[r]->(m)
                    WHERE (n.fqn STARTS WITH 'com.kama' OR n.name STARTS WITH 'com.kama' OR n.signature CONTAINS 'com.kama')
                      AND (m.fqn STARTS WITH 'com.kama' OR m.name STARTS WITH 'com.kama' OR m.signature CONTAINS 'com.kama')
                    RETURN n, r, m 
                    LIMIT 500
                `;
                
                const result = await session.run(query);
                
                let nodesMap = new Map();
                let edgesList = [];

                result.records.forEach(record => {
                    const n = record.get('n');
                    const m = record.get('m');
                    const r = record.get('r');

                    [n, m].forEach(node => {
                        if (!nodesMap.has(node.identity.low)) {
                            const mainLabel = getMainLabel(node.labels);
                            const name = node.properties.name || node.properties.signature || node.properties.fqn || 'Unknown';
                            nodesMap.set(node.identity.low, {
                                id: node.identity.low,
                                label: name,
                                title: name + "\\n" + node.labels.join(', '),
                                mainLabel: mainLabel, // 自定义属性用于过滤
                                color: colorMap[mainLabel] || colorMap['Default'],
                                shape: 'dot',
                                size: mainLabel === 'Type' ? 20 : 10
                            });
                        }
                    });

                    edgesList.push({
                        id: r.identity.low,
                        from: r.start.low,
                        to: r.end.low,
                        label: r.type,
                        arrows: 'to',
                        color: { color: '#636e72' },
                        font: { size: 10, color: '#b2bec3' }
                    });
                });

                allNodes.add(Array.from(nodesMap.values()));
                allEdges.add(edgesList);

                document.getElementById('status').innerText = `加载成功: ${allNodes.length} 个节点, ${allEdges.length} 条边`;

                drawGraph();

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "连接或查询失败！请确保 Neo4j 正在运行。";
                document.getElementById('status').style.color = "#ff7675";
            } finally {
                await session.close();
                await driver.close();
            }
        }

        function drawGraph() {
            // 使用 DataView 来实现过滤，而不改变底层数据集
            const nodesView = new vis.DataView(allNodes, {
                filter: function (node) {
                    // 如果节点的 mainLabel 在复选框中且未勾选，则隐藏
                    const checkbox = document.getElementById('chk-' + node.mainLabel);
                    if (checkbox && !checkbox.checked) {
                        return false;
                    }
                    return true;
                }
            });

            const container = document.getElementById('network');
            const data = {
                nodes: nodesView,
                edges: allEdges
            };
            const options = {
                physics: {
                    barnesHut: {
                        gravitationalConstant: -2000,
                        centralGravity: 0.1,
                        springLength: 150
                    }
                },
                interaction: {
                    hover: true
                }
            };
            
            if (network) {
                network.destroy();
            }
            network = new vis.Network(container, data, options);
        }

        function updateFilter() {
            if (network) {
                // 重新绘制，触发 DataView 的 filter
                network.setData({
                    nodes: new vis.DataView(allNodes, {
                        filter: function (node) {
                            const checkbox = document.getElementById('chk-' + node.mainLabel);
                            if (checkbox && !checkbox.checked) {
                                return false;
                            }
                            return true;
                        }
                    }),
                    edges: allEdges
                });
            }
        }

        // 页面加载完成后自动加载图谱
        window.onload = loadGraph;

    </script>
</body>
</html>
